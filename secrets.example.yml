# Secrets - Dynamic Configuration
#
# Copy this file to dynamic/secrets.yml and fill in actual values.
# This file is gitignored and must be managed directly on the deployment host.
#
#   cp secrets.example.yml dynamic/secrets.yml
#
# Only needed if you have services that require injected credentials
# (e.g., a cable modem that needs Basic Auth headers).
#
# Uncomment the whole block, http: included. An http: block with nothing under it
# is an error, and Traefik then loads no route from any file in dynamic/.

# http:
#   middlewares:
#     # Example: inject Basic Auth header for a backend that requires it
#     # Generate the value with: echo -n "username:password" | base64
#     example-auth:
#       headers:
#         customRequestHeaders:
#           Authorization: "Basic dXNlcm5hbWU6cGFzc3dvcmQ="
