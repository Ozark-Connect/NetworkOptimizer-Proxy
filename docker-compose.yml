name: traefik-proxy

services:
  traefik:
    image: traefik:v3
    container_name: traefik-proxy
    restart: unless-stopped
    network_mode: host
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    command:
      # --- Entrypoints ---
      - "--entrypoints.web.address=${LISTEN_IP:-0.0.0.0}:80"
      - "--entrypoints.websecure.address=${LISTEN_IP:-0.0.0.0}:443"
      # Disable the v3 default 60s readTimeout: it sets a one-shot read deadline
      # at connection setup, which kills long-lived gRPC/streaming connections at
      # exactly 60s. 0 = no timeout.
      - "--entrypoints.websecure.transport.respondingtimeouts.readtimeout=0"
      # Trust X-Forwarded-* only from these upstream proxies (e.g. Cloudflare's ranges).
      # Empty = trust none, which is Traefik's default.
      - "--entrypoints.websecure.forwardedheaders.trustedips=${FORWARDED_TRUSTED_IPS:-}"
      - "--entrypoints.traefik.address=127.0.0.1:${TRAEFIK_API_PORT:-8099}"

      # --- File provider (dynamic config) ---
      - "--providers.file.directory=/etc/traefik/dynamic/"
      - "--providers.file.watch=true"

      # --- Let's Encrypt (DNS-01 via Cloudflare) ---
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=${DNS_RESOLVERS:-1.1.1.1:53,1.0.0.1:53}"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.propagation.delaybeforechecks=${ACME_PROPAGATION_DELAY:-20}"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.propagation.disablechecks=true"

      # --- Ping (used as noop backend for redirects / cert-only domains) ---
      - "--ping=true"

      # --- API (dashboard disabled by default) ---
      - "--api=true"
      - "--api.dashboard=false"

      # --- Logging ---
      - "--log.level=${LOG_LEVEL:-INFO}"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--accesslog.bufferingsize=100"
    volumes:
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./acme:/etc/traefik/acme
      - traefik-logs:/var/log/traefik
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Web Application Firewall (opt-in). Set COMPOSE_PROFILES=waf in .env to run it, then
  # add the "waf" middleware to a router in dynamic/config.yml. See the README.
  netopt-waf:
    build: ./waf
    image: netopt-waf:local
    container_name: netopt-waf
    restart: unless-stopped
    network_mode: host
    profiles: ["waf"]
    environment:
      WAF_LISTEN: ${WAF_LISTEN:-127.0.0.1:8044}
      WAF_MODE: ${WAF_MODE:-detect}
      WAF_PARANOIA: ${WAF_PARANOIA:-1}
      WAF_API_TOKEN: ${WAF_API_TOKEN:-}
    volumes:
      - ./waf-rules:/etc/netopt-waf:ro
    healthcheck:
      test: ["CMD", "/netopt-waf", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  traefik-logs:
