# Built-in exclusions on every router, no opt-in. Each one must be safe for any app behind the WAF.
#
# Blazor Server (Network Optimizer): when a browser cannot hold a WebSocket, SignalR falls back to
# Long Polling or Server-Sent Events and posts its handshake to /_blazor as text/plain, and its
# binary messages as application/octet-stream. The CRS content-type policy (920420) allows neither,
# so the circuit fails. That one rule is off on /_blazor only, at the root or under one base path
# segment. The body is still inspected, and no other app answers that path.
SecRule REQUEST_FILENAME "@rx ^(?:/[A-Za-z0-9_-]+)?/_blazor$" "id:1005,phase:1,pass,nolog,ctl:ruleRemoveById=920420"

# JSON key names: Coraza names each JSON body key json.<key>, and the OS file list (930120) matches
# substrings of those names, so ordinary keys such as profileId, history, and bashrc read as file
# access. 930120 skips JSON key names only. JSON values and query string names are still checked.
SecAction "id:1007,phase:1,pass,nolog,ctl:ruleRemoveTargetById=930120;ARGS_NAMES:/^json\./"
