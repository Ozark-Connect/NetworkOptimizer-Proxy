# Jellyfin: the web client caps an unknown or unlimited bitrate at 2147483647 (INT_MAX) and sends
# it as MaxStreamingBitrate on PlaybackInfo, stream, and capability requests. A whole value equal
# to INT_MAX is exactly what 942220 matches, so that one rule is off on the whole router, since the
# value rides on too many paths to list. The web client's own /web/config.json trips 930130
# (config.json is a restricted file name) and is allowed at that one path, at the root or under
# one base URL segment. Everything else stays inspected.
# X-Netopt-App is set by the WAF from the forwardAuth address; a copy from the client is dropped.
SecRule REQUEST_HEADERS:X-Netopt-App "@streq jellyfin" "id:1002,phase:1,pass,nolog,ctl:ruleRemoveById=942220"
SecRule REQUEST_HEADERS:X-Netopt-App "@streq jellyfin" "id:1003,phase:1,pass,nolog,chain"
    SecRule REQUEST_FILENAME "@rx ^(?:/[A-Za-z0-9_-]+)?/web/config\.json$" "ctl:ruleRemoveById=930130"
