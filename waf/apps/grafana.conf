# Grafana: query text (Flux, InfluxQL, PromQL, LogQL, SQL, and ${var} / $__macro templating) reads
# as RCE, PHP, SQL injection, and XSS: the Flux builder's `timeRangeStop) ... r["_measurement"]`
# trips 941370 (XSS) on its own. Only these families, only on the endpoints that carry queries
# (dashboard and library panel saves hold the same queries, plus text panel HTML), and only on
# routers that opt in with /check?app=grafana. Never by path alone: a front-controller app
# (WordPress) on the same WAF would run any request to these paths and lose the checks.
# X-Netopt-App is set by the WAF from the forwardAuth address; a copy from the client is dropped.
SecRule REQUEST_HEADERS:X-Netopt-App "@streq grafana" "id:1001,phase:1,pass,nolog,chain"
    SecRule REQUEST_FILENAME "@rx ^(?:/[A-Za-z0-9_-]+)?/api/(?:ds/query$|query-history(?:/|$)|datasources/proxy/|datasources/uid/[^/]+/resources/|ruler/grafana/api/v1/rules|dashboards/(?:db|import)$|library-elements(?:/|$))" \
        "ctl:ruleRemoveByTag=attack-rce,ctl:ruleRemoveByTag=attack-injection-php,ctl:ruleRemoveByTag=attack-sqli,ctl:ruleRemoveByTag=attack-xss"
