# Grafana: query text (Flux, InfluxQL, PromQL, LogQL, SQL, and ${var} / $__macro templating) reads
# as RCE, PHP, and SQL injection. Only these families, only on the endpoints that carry queries.
SecRule REQUEST_FILENAME "@rx (?:^|/)api/(?:ds/query$|query-history(?:/|$)|datasources/proxy/|datasources/uid/[^/]+/resources/|ruler/grafana/api/v1/rules)" \
    "id:1001,phase:1,pass,nolog,ctl:ruleRemoveByTag=attack-rce,ctl:ruleRemoveByTag=attack-injection-php,ctl:ruleRemoveByTag=attack-sqli"

# Saved dashboards and library panels carry the same queries, plus HTML from text panels.
SecRule REQUEST_FILENAME "@rx (?:^|/)api/(?:dashboards/(?:db|import)$|library-elements(?:/|$))" \
    "id:1002,phase:1,pass,nolog,ctl:ruleRemoveByTag=attack-rce,ctl:ruleRemoveByTag=attack-injection-php,ctl:ruleRemoveByTag=attack-sqli,ctl:ruleRemoveByTag=attack-xss"
