# Sonarr, Radarr, Lidarr, Prowlarr, Readarr, Whisparr: their web UI holds a SignalR connection, and
# the SignalR client posts to /signalr/messages/negotiate and /signalr/messages as text/plain,
# which the CRS content-type policy (920420) does not allow. That one rule is off on those two
# paths, at the root or under one base URL segment. Everything else, the API included, stays inspected.
# X-Netopt-App is set by the WAF from the forwardAuth address; a copy from the client is dropped.
SecRule REQUEST_HEADERS:X-Netopt-App "@streq arr" "id:1004,phase:1,pass,nolog,chain"
    SecRule REQUEST_FILENAME "@rx ^(?:/[A-Za-z0-9_-]+)?/signalr/messages(?:/negotiate)?$" "ctl:ruleRemoveById=920420"
